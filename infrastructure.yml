AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal EC2 resume website with GitHub, CodePipeline, CodeBuild and CodeDeploy.
Parameters:
  GitHubConnectionArn:
    Type: String
    Description: ARN of an AVAILABLE CodeConnections GitHub connection.
  GitHubRepository:
    Type: String
    Default: alllannguyen/DevOpsAssignment4
  GitHubBranch:
    Type: String
    Default: master
  InstanceType:
    Type: String
    Default: t3.micro
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
  ResumeBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP access to the resume website
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [ec2.amazonaws.com] }
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadDeploymentArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion']
                Resource: !Sub '${ArtifactBucket.Arn}/*'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  WebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!Ref WebSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-web' }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y httpd ruby wget
          systemctl enable --now httpd
          cd /tmp
          wget https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install -O codedeploy-install
          chmod +x codedeploy-install
          ./codedeploy-install auto
          systemctl enable --now codedeploy-agent
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [codedeploy.amazonaws.com] }
            Action: ['sts:AssumeRole']
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole']
  Application:
    Type: AWS::CodeDeploy::Application
    Properties: { ComputePlatform: Server }
  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref Application
      ServiceRoleArn: !GetAtt DeployRole.Arn
      DeploymentConfigName: CodeDeployDefault.OneAtATime
      DeploymentStyle: { DeploymentOption: WITHOUT_TRAFFIC_CONTROL, DeploymentType: IN_PLACE }
      Ec2TagFilters:
        - { Key: Name, Value: !Sub '${AWS::StackName}-web', Type: KEY_AND_VALUE }
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [codebuild.amazonaws.com] }
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: BuildArtifactsAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject']
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: ['logs:CreateLogGroup', 'logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: '*'
  Build:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt BuildRole.Arn
      Source: { Type: CODEPIPELINE }
      Artifacts: { Type: CODEPIPELINE }
      Environment: { Type: LINUX_CONTAINER, ComputeType: BUILD_GENERAL1_SMALL, Image: 'aws/codebuild/standard:7.0' }
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [codepipeline.amazonaws.com] }
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: PipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject']
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: ['s3:GetBucketVersioning', 's3:GetBucketLocation']
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action: ['codestar-connections:UseConnection', 'codeconnections:UseConnection']
                Resource: !Ref GitHubConnectionArn
              - Effect: Allow
                Action: ['codebuild:StartBuild', 'codebuild:BatchGetBuilds']
                Resource: !GetAtt Build.Arn
              - Effect: Allow
                Action: ['codedeploy:CreateDeployment', 'codedeploy:GetApplication', 'codedeploy:GetApplicationRevision', 'codedeploy:GetDeployment', 'codedeploy:GetDeploymentConfig', 'codedeploy:RegisterApplicationRevision']
                Resource: '*'
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactBucket }
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: '1' }
              Configuration: { ConnectionArn: !Ref GitHubConnectionArn, FullRepositoryId: !Ref GitHubRepository, BranchName: !Ref GitHubBranch, DetectChanges: 'true' }
              OutputArtifacts: [{ Name: SourceArtifact }]
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Package
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration: { ProjectName: !Ref Build }
              InputArtifacts: [{ Name: SourceArtifact }]
              OutputArtifacts: [{ Name: BuildArtifact }]
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: DeployToEC2
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CodeDeploy, Version: '1' }
              Configuration: { ApplicationName: !Ref Application, DeploymentGroupName: !Ref DeploymentGroup }
              InputArtifacts: [{ Name: BuildArtifact }]
              RunOrder: 1
Outputs:
  WebsiteURL: { Value: !Sub 'http://${WebInstance.PublicIp}/' }
  ResumeBucketName: { Value: !Ref ResumeBucket }
  ArtifactBucketName: { Value: !Ref ArtifactBucket }
  PipelineName: { Value: !Ref Pipeline }
